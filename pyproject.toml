[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchbend"
version = "0.1.0"
description = "Neural network bending and tracing utilities"
requires-python = ">=3.9"
dynamic = ["dependencies", "optional-dependencies"]

[project.urls]
Repository = "https://github.com/acids-ircam/torchbend"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["torchbend*"]

[tool.setuptools.package-data]
torchbend = ["interfaces/requirements/*.txt"]
